name: Extract N94 iOS 6.1.3 Audio HAL

on:
  push:
    branches:
      - chatgpt-ios6-micfix-build
    paths:
      - '.github/workflows/extract-n94-ios613-rootfs.yml'

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl file llvm binutils
          python3 -m pip install pycryptodome

      - name: Download exact iPhone 4S iOS 6.1.3 IPSW
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --connect-timeout 30 \
            -o /tmp/iPhone4,1_6.1.3_10B329_Restore.ipsw \
            'https://secure-appldnld.apple.com/iOS6.1/091-2611.20130319.Fr54r/iPhone4%2C1_6.1.3_10B329_Restore.ipsw'
          echo '7a62ee60b574301a6aafc48dcc9cccf0894ffb27  /tmp/iPhone4,1_6.1.3_10B329_Restore.ipsw' | sha1sum -c -

      - name: Get rootfs extractor
        run: |
          set -euxo pipefail
          curl -L --fail -o /tmp/rootfs-extract.py \
            https://raw.githubusercontent.com/rzxvx/Project-Cascadia/main/scripts/rootfs-extract.py
          chmod +x /tmp/rootfs-extract.py
          mkdir -p n94-rootfs-audio

      - name: Extract VirtualAudio HAL
        continue-on-error: true
        run: |
          python3 /tmp/rootfs-extract.py \
            /tmp/iPhone4,1_6.1.3_10B329_Restore.ipsw \
            048-2613-005.dmg \
            d4685a3c01a0b6f762350191d98b8964d4c7af349aa84bacef828be9683514ccf44a8426 \
            /Library/Audio/Plug-Ins/HAL/VirtualAudio.plugin/VirtualAudio \
            n94-rootfs-audio/VirtualAudio

      - name: Extract mediaserverd
        continue-on-error: true
        run: |
          python3 /tmp/rootfs-extract.py \
            /tmp/iPhone4,1_6.1.3_10B329_Restore.ipsw \
            048-2613-005.dmg \
            d4685a3c01a0b6f762350191d98b8964d4c7af349aa84bacef828be9683514ccf44a8426 \
            /usr/sbin/mediaserverd \
            n94-rootfs-audio/mediaserverd

      - name: Extract audio frameworks from device rootfs
        continue-on-error: true
        run: |
          python3 /tmp/rootfs-extract.py \
            /tmp/iPhone4,1_6.1.3_10B329_Restore.ipsw \
            048-2613-005.dmg \
            d4685a3c01a0b6f762350191d98b8964d4c7af349aa84bacef828be9683514ccf44a8426 \
            /System/Library/Frameworks/AudioToolbox.framework/AudioToolbox \
            n94-rootfs-audio/AudioToolbox \
            /System/Library/Frameworks/CoreMedia.framework/CoreMedia \
            n94-rootfs-audio/CoreMedia

      - name: Analyze extracted binaries
        run: |
          set -euxo pipefail
          for f in n94-rootfs-audio/*; do
            [ -f "$f" ] || continue
            file "$f" | tee "$f.file.txt"
            strings -a "$f" | grep -Eai 'BuiltInMicSelection|microphone|mic selector|AUMicSelector|BottomMic|TopMic|BackMic|FrontMic|InputDataSource|AudioRoute|N94|VoiceProcessor|VideoRecording' \
              | sort -u > "$f.audio-strings.txt" || true
            llvm-objdump --macho --private-headers "$f" > "$f.headers.txt" 2>&1 || true
            llvm-objdump --macho --dylibs-used "$f" > "$f.dylibs.txt" 2>&1 || true
            llvm-objdump --macho --syms "$f" > "$f.syms.txt" 2>&1 || true
            llvm-objdump --macho --disassemble "$f" > "$f.disasm.txt" 2>&1 || true
          done
          grep -R -n -E 'BuiltInMicSelection|AUMicSelector|BottomMic|TopMic|BackMic|FrontMic|N94' n94-rootfs-audio || true

      - name: Upload focused audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N94-iOS613-AudioHAL
          path: n94-rootfs-audio
          if-no-files-found: error
