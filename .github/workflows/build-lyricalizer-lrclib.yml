name: Build Lyricalizer LRCLIB iOS 6

on:
  push:
    branches:
      - lyricalizer-lrclib-build
    paths:
      - 'lyricalizer_lrclib/**'
      - '.github/workflows/build-lyricalizer-lrclib.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Theos
        uses: Randomblock1/theos-action@main
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build armv7 rootful deb
        working-directory: lyricalizer_lrclib
        run: |
          make clean package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print -exec sha256sum {} \;

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Lyricalizer-LRCLIB-iOS6
          path: lyricalizer_lrclib/packages/*.deb
          if-no-files-found: error
