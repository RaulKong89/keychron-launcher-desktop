name: Build Lyricalizer LRCLIB iOS 6

on:
  push:
    branches:
      - lyricalizer-lrclib-build
    paths:
      - 'lyricalizer_lrclib/**'
      - '.github/workflows/build-lyricalizer-lrclib.yml'

concurrency:
  group: lyricalizer-lrclib-ios6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git libxml2 libtinfo6 bzip2
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Cache legacy Theos toolchain
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: lyricalizer-theos-linux-ios61-v1

      - name: Prepare Theos + Linux iOS toolchain + iOS 6.1 SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

          curl -fL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"

          mkdir -p "$THEOS/sdks"
          curl -fL -o /tmp/iPhoneOS6.1.sdk.zip \
            https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip
          unzip -q /tmp/iPhoneOS6.1.sdk.zip -d "$THEOS/sdks"
          rm -f /tmp/iPhoneOS6.1.sdk.zip

          test -f "$THEOS/sdks/iPhoneOS6.1.sdk/SDKSettings.plist"

      - name: Build self-contained TLS engine for armv7
        run: |
          set -euxo pipefail
          rm -rf /tmp/mbedtls
          mkdir -p /tmp/mbedtls
          curl -fL -o /tmp/mbedtls.tar.bz2 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-2.28.10/mbedtls-2.28.10.tar.bz2
          tar -xjf /tmp/mbedtls.tar.bz2 -C /tmp/mbedtls --strip-components=1

          CC="$THEOS/toolchain/linux/iphone/bin/clang"
          AR="$THEOS/toolchain/linux/iphone/bin/ar"
          if [ ! -x "$AR" ]; then AR="$THEOS/toolchain/linux/iphone/bin/llvm-ar"; fi
          SDK="$THEOS/sdks/iPhoneOS6.1.sdk"

          make -C /tmp/mbedtls/library -j2 \
            CC="$CC" AR="$AR" AR_DASH= \
            CFLAGS="-Os -fPIC -arch armv7 -isysroot $SDK -miphoneos-version-min=6.0 -Wno-deprecated-declarations"

          rm -rf lyricalizer_lrclib/vendor/mbedtls
          mkdir -p lyricalizer_lrclib/vendor/mbedtls/include lyricalizer_lrclib/vendor/mbedtls/lib
          cp -R /tmp/mbedtls/include/mbedtls lyricalizer_lrclib/vendor/mbedtls/include/
          cp -R /tmp/mbedtls/include/psa lyricalizer_lrclib/vendor/mbedtls/include/
          cp /tmp/mbedtls/library/libmbedtls.a lyricalizer_lrclib/vendor/mbedtls/lib/
          cp /tmp/mbedtls/library/libmbedx509.a lyricalizer_lrclib/vendor/mbedtls/lib/
          cp /tmp/mbedtls/library/libmbedcrypto.a lyricalizer_lrclib/vendor/mbedtls/lib/

          mkdir -p "lyricalizer_lrclib/layout/Library/Application Support/LyricalizerLRCLIB"
          curl -fL https://curl.se/ca/cacert.pem \
            -o "lyricalizer_lrclib/layout/Library/Application Support/LyricalizerLRCLIB/cacert.pem"
          cp /tmp/mbedtls/LICENSE \
            "lyricalizer_lrclib/layout/Library/Application Support/LyricalizerLRCLIB/MBEDTLS-LICENSE.txt"

          file lyricalizer_lrclib/vendor/mbedtls/lib/*.a
          wc -c "lyricalizer_lrclib/layout/Library/Application Support/LyricalizerLRCLIB/cacert.pem"

      - name: Build armv7 rootful deb
        working-directory: lyricalizer_lrclib
        run: |
          make clean package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print -exec sha256sum {} \;

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Lyricalizer-LRCLIB-iOS6-selfcontained
          path: lyricalizer_lrclib/packages/*.deb
          if-no-files-found: error
