name: Build Lyricalizer LRCLIB iOS 6

on:
  push:
    branches:
      - lyricalizer-lrclib-build
    paths:
      - 'lyricalizer_lrclib/**'
      - '.github/workflows/build-lyricalizer-lrclib.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare legacy Theos + iOS 6.1 SDK
        uses: Vusys/WallpaperParallax/.github/actions/setup-theos@e124f23df3bf6353663921483f660b960473a026
        with:
          theos-dir: theos
          sdk-name: iPhoneOS6.1.sdk
          sdk-url: https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip
          cache-key-suffix: lyricalizer-ios6-v1

      - name: Build armv7 rootful deb
        working-directory: lyricalizer_lrclib
        run: |
          make clean package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print -exec sha256sum {} \;

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Lyricalizer-LRCLIB-iOS6
          path: lyricalizer_lrclib/packages/*.deb
          if-no-files-found: error
