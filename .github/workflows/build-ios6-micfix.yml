name: Build iOS 6 Bottom Mic Redirect

on:
  push:
    branches:
      - chatgpt-ios6-micfix-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev curl xz-utils git libtinfo5

      - name: Install iOS ARMv7 toolchain and SDK
        run: |
          mkdir -p "$HOME/ios-toolchain"
          curl -L --fail -o /tmp/toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          tmpdir="$(mktemp -d)"
          tar -xvf /tmp/toolchain.tar.lzma -C "$tmpdir"
          cp -a "$tmpdir"/ios-arm64e-clang-toolchain/. "$HOME/ios-toolchain/"

          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/iPhoneOS9.3.sdk "$HOME/iPhoneOS9.3.sdk"

      - name: Compile ARMv7 dylib and build DEB
        run: |
          set -euxo pipefail
          TC="$HOME/ios-toolchain"
          SDK="$HOME/iPhoneOS6.1.sdk"
          SRC="$GITHUB_WORKSPACE/ios6-micfix/Tweak.c"
          OUT="$GITHUB_WORKSPACE/ios6-micfix/build"
          PKG="$OUT/pkg"
          mkdir -p "$OUT" "$PKG/DEBIAN" "$PKG/Library/MobileSubstrate/DynamicLibraries"

          "$TC/bin/clang" \
            -target armv7-apple-ios6.0 \
            -isysroot "$SDK" \
            -Os -fPIC -dynamiclib \
            -Wl,-install_name,/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib \
            -Wl,-dead_strip \
            "$SRC" \
            -o "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"

          "$TC/bin/ldid" -S "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"

          cp "$GITHUB_WORKSPACE/ios6-micfix/layout/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.plist" \
             "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.plist"
          cp "$GITHUB_WORKSPACE/ios6-micfix/control" "$PKG/DEBIAN/control"
          cp "$GITHUB_WORKSPACE/ios6-micfix/layout/DEBIAN/postinst" "$PKG/DEBIAN/postinst"
          chmod 0755 "$PKG/DEBIAN/postinst"

          file "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"
          "$TC/bin/otool" -hv "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib" || true

          dpkg-deb --build --root-owner-group "$PKG" "$OUT/com.raulkong89.bottommicredirect_1.0.0_iphoneos-arm.deb"
          dpkg-deb --info "$OUT/com.raulkong89.bottommicredirect_1.0.0_iphoneos-arm.deb"
          dpkg-deb --contents "$OUT/com.raulkong89.bottommicredirect_1.0.0_iphoneos-arm.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: iPhone4S-iOS6-BottomMicRedirect-DEB
          path: ios6-micfix/build/*.deb
          if-no-files-found: error
