name: Build iOS 6 Bottom Mic Redirect

on:
  push:
    branches:
      - chatgpt-ios6-micfix-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev curl xz-utils git unzip libtinfo5

      - name: Install iOS ARMv7 toolchain and legacy SDK
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/ios-toolchain"
          curl -L --fail -o /tmp/toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          tmpdir="$(mktemp -d)"
          tar -xvf /tmp/toolchain.tar.lzma -C "$tmpdir"
          cp -a "$tmpdir"/ios-arm64e-clang-toolchain/. "$HOME/ios-toolchain/"

          git clone --depth 1 https://github.com/Sn0wCooder/theos-sdks.git /tmp/legacy-sdks
          cat /tmp/legacy-sdks/iPhoneOS6.1.sdk/iPhoneOS6.1.sdk.zip.* > /tmp/iPhoneOS6.1.sdk.zip
          mkdir -p /tmp/ios61-unpacked
          unzip -q /tmp/iPhoneOS6.1.sdk.zip -d /tmp/ios61-unpacked
          SDK_FOUND="$(find /tmp/ios61-unpacked -maxdepth 4 -type d -name iPhoneOS6.1.sdk | head -n 1)"
          test -n "$SDK_FOUND"
          cp -a "$SDK_FOUND" "$HOME/iPhoneOS6.1.sdk"
          test -f "$HOME/iPhoneOS6.1.sdk/usr/include/stdlib.h"
          test -f "$HOME/iPhoneOS6.1.sdk/System/Library/Frameworks/AVFoundation.framework/Headers/AVAudioSession.h"

      - name: Compile ARMv7 dylib and build DEB
        run: |
          set -euxo pipefail
          TC="$HOME/ios-toolchain"
          SDK="$HOME/iPhoneOS6.1.sdk"
          SRC="$GITHUB_WORKSPACE/ios6-micfix/TweakV2.m"
          OUT="$GITHUB_WORKSPACE/ios6-micfix/build-v2"
          PKG="$OUT/pkg"
          mkdir -p "$OUT" "$PKG/DEBIAN" "$PKG/Library/MobileSubstrate/DynamicLibraries"

          "$TC/bin/clang" \
            -target armv7-apple-ios6.0 \
            -isysroot "$SDK" \
            -Os -fPIC -fno-objc-arc -dynamiclib \
            -framework Foundation \
            -framework AVFoundation \
            -framework AudioToolbox \
            -Wl,-install_name,/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib \
            -Wl,-dead_strip \
            "$SRC" \
            -o "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"

          "$TC/bin/ldid" -S "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"

          cp "$GITHUB_WORKSPACE/ios6-micfix/layout/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.plist" \
             "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.plist"
          cp "$GITHUB_WORKSPACE/ios6-micfix/control" "$PKG/DEBIAN/control"
          cp "$GITHUB_WORKSPACE/ios6-micfix/layout/DEBIAN/postinst" "$PKG/DEBIAN/postinst"
          chmod 0755 "$PKG/DEBIAN/postinst"

          echo "=== dylib architecture ==="
          file "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib"
          "$TC/bin/otool" -hv "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib" || true
          "$TC/bin/otool" -L "$PKG/Library/MobileSubstrate/DynamicLibraries/BottomMicRedirect.dylib" || true

          DEB="$OUT/com.raulkong89.bottommicredirect_2.0.0_iphoneos-arm.deb"
          dpkg-deb --build --root-owner-group -Zgzip "$PKG" "$DEB"
          echo "=== package info ==="
          dpkg-deb --info "$DEB"
          echo "=== package contents ==="
          dpkg-deb --contents "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: iPhone4S-iOS6-BottomMicRedirect-v2-DEB
          path: ios6-micfix/build-v2/*.deb
          if-no-files-found: error
